fps: 60
size: [1920, 1080]
output: out/HotelOddities_Trailer.mp4

grade:
  exposure: -0.45
  contrast: 1.2
  pivot: 0.4
  saturation: 0.8
  lift: 0.01
  shadows: [0.84, 0.93, 1.09]
  highlights: [1.08, 1.0, 0.86]
  bloom: 0.28
  bloom_threshold: 0.6
  halation: 0.12
  vignette: 0.5
  aberration: 1.6
  grain: 0.03
  shoulder: 0.82

timeline:
  - { id: open, black: 0.35 }
  - { id: arrival, clip: Arrival, in: 0.45, out: 4.25, fade_in: 1.1 }
  - { id: rotunda, clip: Rotunda, in: 1.9, out: 5.3, grade: { exposure: -0.15 } }
  - { id: stalker, clip: Stalker, in: 0.4, out: 3.75, grade: { exposure: -0.6, saturation: 0.72 } }
  - { id: creep, clip: Creep, in: 1.4, out: 4.75, grade: { exposure: -0.35 } }
  - { id: painting, clip: Painting, in: 0.95, out: 2.25, grade: { exposure: -0.7 } }
  - { id: chase, clip: Chase, in: 0.6, out: 2.6, grade: { exposure: -0.65 } }
  - { id: mimic, clip: Mimic, in: 0.6, out: 3.0, grade: { exposure: -0.4 } }
  - { id: hit, black: 0.75 }
  - { id: title, black: 4.0 }
  - { id: sting, clip: Sting, in: 0.2, out: 3.0, grade: { exposure: -0.6, saturation: 0.7 } }
  - { id: end, black: 1.5 }

effects:
  - { type: zoom, at: "stalker+1.3", amount: 0.03, attack: 0.06, hold: 0.2, duration: 0.6 }
  - { type: shake, at: "stalker+1.3", duration: 0.55, strength: 7 }
  - { type: shake, at: "creep+1.85", duration: 1.2, strength: 3, frequency: 9 }
  - { type: flash, at: "painting+0.5", duration: 0.14, strength: 0.55, color: [1.0, 0.92, 0.85] }
  - { type: shake, at: "painting+0.5", duration: 0.5, strength: 14 }
  - { type: shake, at: "mimic+0.95", duration: 0.25, strength: 2 }
  - { type: flash, at: "mimic+1.02", duration: 0.09, strength: 0.3, color: [1.0, 0.75, 0.75] }
  - { type: shake, at: "mimic+1.02", duration: 0.6, strength: 4 }
  - { type: glitch, at: "mimic+1.02", duration: 0.06, strength: 0.5 }
  - { type: glitch, at: "title+0.35", duration: 0.22, strength: 1.0 }
  - { type: glitch, at: "title+1.4", duration: 0.07, strength: 0.6 }
  - { type: zoom, at: "sting+2.0", amount: 0.05, attack: 0.05, hold: 0.8, duration: 0.6 }
  - { type: shake, at: "sting+2.0", duration: 0.5, strength: 9 }

text:
  - id: welcome
    text: "Welcome, guest."
    type: typewriter
    at: "arrival+1.0"
    until: "arrival.end-0.1"
    cps: 17
    size: 46
    pos: [0.5, 0.84]
  - id: room
    text: "Your room is ready."
    type: typewriter
    at: "rotunda+0.45"
    until: "rotunda.end-0.05"
    cps: 18
    size: 46
    pos: [0.5, 0.84]
  - id: computers
    text: "Five computers."
    type: typewriter
    at: "creep+0.1"
    until: "creep+1.5"
    cps: 20
    size: 46
    pos: [0.5, 0.84]
  - id: exit
    text: "One way out."
    type: typewriter
    at: "creep+1.65"
    until: "creep.end"
    cps: 18
    size: 46
    pos: [0.5, 0.84]
    fade_out: 0.05
  - id: logo
    type: image
    file: art/logo.png
    at: "title+0.35"
    until: "title.end"
    width: 0.62
    pos: [0.5, 0.44]
    grow: [0.95, 1.0]
    fade_in: 0.5
    fade_out: 0.3
    flicker: 0.55
  - id: stay
    text: "Enjoy your stay."
    type: typewriter
    at: "title+2.1"
    until: "title.end"
    cps: 15
    size: 40
    pos: [0.5, 0.87]
    fade_out: 0.3
  - id: endlogo
    type: image
    file: art/logo.png
    at: "end+0.15"
    until: "end.end"
    width: 0.34
    pos: [0.5, 0.43]
    grow: [0.98, 1.0]
    fade_in: 0.35
    fade_out: 0.25
  - id: platform
    text: "PLAY NOW"
    type: fade
    at: "end+0.35"
    until: "end.end"
    font: fonts/IMFellEnglishSC-Regular.ttf
    size: 34
    tracking: 0.18
    pos: [0.5, 0.74]
    fade_in: 0.35
    fade_out: 0.25
    glow: 0.2

typewriter:
  file: game/Type.ogg
  start: 0.04
  length: 0.28
  gain: -13
  pitch_spread: 0.08

master:
  lufs: -14
  ceiling_db: -1.0
  compress_db: -10
  buses: { music: 0, sfx: 0, ui: 0, bed: 0 }

audio:
  - { file: gen/crackle.wav, at: "open+0.0", until: "stalker+1.3", gain: -26, fade_in: 0.4, highpass: 250, bus: bed, loop: true, length: 12 }
  - file: game/RecordLobby.ogg
    at: "open+0.05"
    start: 0.0
    until: "stalker+2.2"
    gain: -19
    fade_in: 1.4
    highpass: 200
    lowpass: 4300
    reverb: 0.22
    bus: music
    tape_stop: { at: "stalker+1.18", length: 0.55, curve: 1.6 }
  - { file: game/Elevator.ogg, at: "arrival-0.15", gain: -15, reverb: 0.3, bus: sfx }
  - { file: gen/drone.wav, at: "arrival+0.6", length: 12, gain: -30, fade_in: 5, fade_out: 1.5, bus: bed }
  - { file: gen/whoosh.wav, at: "rotunda-0.85", gain: -17, bus: sfx }
  - { file: gen/riser.wav, at: "stalker+1.3-6.0", gain: -17, bus: sfx }
  - { file: gen/braam.wav, at: "stalker+1.3", gain: -3, bus: sfx }
  - { file: game/Notice.ogg, at: "stalker+1.3", gain: -8, bus: sfx }
  - { file: gen/sub_drop.wav, at: "stalker+1.3", gain: -7, bus: sfx }
  - { file: gen/strings_stab.wav, at: "stalker+1.32", gain: -15, bus: sfx }
  - { file: game/Drone.ogg, at: "stalker+1.4", start: 4, until: "hit+0.0", gain: -15, fade_in: 0.4, fade_out: 0.05, bus: bed }
  - { file: game/LongCreak.ogg, at: "mimic+0.0", start: 1.6, length: 1.2, gain: -8, fade_out: 0.3, bus: sfx }
  - file: game/Heartbeat.ogg
    at: "stalker+1.9"
    gain: -9
    bus: sfx
    repeat: { every: [0.9, 0.42], until: "mimic+0.9", gain: [-12, -5] }
  - { file: game/Dip.ogg, at: "stalker+2.6", gain: -9, bus: sfx }
  - { file: game/Flicker.ogg, at: "creep+0.0", gain: -20, pan: -0.3, bus: sfx }
  - { file: game/LightOut.ogg, at: "creep+0.12", start: 0.12, gain: -15, pan: -0.25, bus: sfx }
  - { file: game/LightOut.ogg, at: "creep+0.47", start: 0.12, gain: -13, pan: 0.25, bus: sfx }
  - { file: game/LightOut.ogg, at: "creep+0.77", start: 0.12, gain: -11, pan: -0.3, bus: sfx }
  - { file: game/LightOut.ogg, at: "creep+1.02", start: 0.12, gain: -9, pan: 0.3, bus: sfx }
  - { file: game/LightOut.ogg, at: "creep+1.22", start: 0.12, gain: -7, pan: -0.2, bus: sfx }
  - { file: game/LightOut.ogg, at: "creep+1.55", start: 0.12, gain: -4, bus: sfx }
  - { file: game/EyesOpen.ogg, at: "creep+1.85-2.6", gain: -6, bus: sfx }
  - file: gen/pulse.wav
    at: "creep+2.45"
    gain: -9
    bus: music
    repeat: { every: [0.5, 0.34], until: "chase.end", gain: [-12, -5] }
  - { file: game/PaintingDwellerPop.ogg, at: "painting+0.48", gain: -3, bus: sfx }
  - { file: game/PaintingDwellerScream.ogg, at: "painting+0.52", length: 1.1, gain: -13, fade_out: 0.4, bus: sfx }
  - { file: gen/impact.wav, at: "painting+0.5", gain: -10, bus: sfx }
  - { file: game/CeilingDwellerChase.ogg, at: "chase+0.0", until: "chase.end", gain: -12, fade_in: 0.05, fade_out: 0.12, bus: music }
  - { file: game/Walk.ogg, at: "chase+0.0", until: "chase.end", speed: 1.7, gain: -16, bus: sfx }
  - { file: gen/whoosh.wav, at: "chase+1.1", gain: -15, bus: sfx }
  - { file: game/MadGuestSting.ogg, at: "chase+0.2", gain: -9, bus: sfx }
  - { file: game/Walk.ogg, at: "mimic+0.0", until: "mimic+0.85", speed: 0.9, gain: -15, fade_out: 0.2, bus: sfx }
  - { file: game/Flicker.ogg, at: "mimic+0.8", gain: -16, pan: 0.2, bus: sfx }
  - { file: game/LightOut.ogg, at: "mimic+0.91", start: 0.12, gain: -9, pan: 0.15, bus: sfx }
  - { file: game/LightOut.ogg, at: "mimic+0.96", start: 0.12, gain: -11, pan: -0.25, bus: sfx }
  - { file: gen/crack.wav, at: "mimic+0.95", gain: -6, bus: sfx }
  - { file: game/MimicSting.ogg, at: "mimic+1.02", until: "hit+0.0", fade_out: 0.05, gain: -4, reverb: 0.25, bus: sfx }
  - { file: game/MimicSting.ogg, at: "mimic+1.02", until: "hit+0.0", fade_out: 0.05, speed: 0.472, gain: -7, bus: sfx }
  - { file: gen/strings_stab.wav, at: "mimic+1.02", until: "hit+0.0", fade_out: 0.05, gain: -11, bus: sfx }
  - { file: gen/impact.wav, at: "mimic+1.02", until: "hit+0.0", fade_out: 0.05, gain: -9, bus: sfx }
  - { file: gen/impact.wav, at: "hit+0.0", length: 2.0, fade_out: 1.2, gain: -1, bus: sfx }
  - { file: gen/sub_drop.wav, at: "hit+0.0", gain: -3, bus: sfx }
  - { file: gen/braam.wav, at: "hit+0.02", length: 2.2, fade_out: 1.2, gain: -12, bus: sfx }
  - { file: gen/tinnitus.wav, at: "hit+0.08", gain: -26, bus: sfx }
  - { file: gen/reverse_swell.wav, at: "title+0.35-1.1", start: 1.3, gain: -17, bus: sfx }
  - { file: gen/braam.wav, at: "title+0.35", length: 3.5, fade_out: 1.8, gain: -16, bus: sfx }
  - { file: gen/glitch.wav, at: "title+0.35", gain: -17, bus: sfx }
  - { file: gen/glitch.wav, at: "title+1.4", length: 0.08, gain: -20, bus: sfx }
  - file: game/Record.ogg
    at: "title+1.3"
    start: 10.2
    length: 3.4
    speed: 0.8
    gain: -15
    fade_in: 0.8
    fade_out: 1.0
    highpass: 250
    lowpass: 2200
    reverb: 0.55
    bus: music
  - { file: game/Whip.ogg, at: "sting+0.0", start: 0.7, gain: -14, bus: sfx }
  - { file: game/BreathGiggle.ogg, at: "sting+0.95", gain: -6, pan: 0.2, reverb: 0.2, bus: sfx }
  - { file: game/MimicSting.ogg, at: "sting+2.0", until: "sting.end", fade_out: 0.04, gain: -6, bus: sfx }
  - { file: gen/strings_stab.wav, at: "sting+2.0", until: "sting.end", fade_out: 0.04, gain: -10, bus: sfx }
  - { file: gen/impact.wav, at: "sting+2.0", until: "sting.end", fade_out: 0.04, gain: -5, bus: sfx }
  - { file: gen/sub_drop.wav, at: "sting.end", gain: -16, bus: sfx }
  - { file: gen/drone.wav, at: "end+0.0", start: 8, length: 1.6, gain: -32, fade_in: 0.3, fade_out: 0.8, bus: bed }
